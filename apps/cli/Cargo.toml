[package]
name = "reflect-cli"
version = "0.1.0"
description = "Read/discovery CLI over a Kore graph (Plan 14)"
edition = "2021"

[[bin]]
name = "kore"
path = "src/main.rs"

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `vec` registers sqlite-vec, so the read-only connection can run the same
# KNN queries the app's semantic search runs over `embedding_vectors`.
reflect-index-schema = { path = "../../crates/index-schema" }
reflect-index-store = { workspace = true }
reflect-graph-paths = { workspace = true }
reflect-note-policy = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
jiff = "0.2.28"
saphyr = "0.0.6"
sha2 = { workspace = true }
unicode-normalization = "0.1.24"
unicode-general-category = "1.0.0"
tempfile = { workspace = true }
base64 = "0.22.1"
getrandom = "0.3.4"
tiny_http = "0.12.0"
# Semantic search (`embed.rs`): the app's MiniLM `model.onnx` run on tract, a
# pure-Rust ONNX runtime (no native library to ship or download at build
# time), tokenized by the same `tokenizers` release and features fastembed uses.
tract-onnx = "0.23.9"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
