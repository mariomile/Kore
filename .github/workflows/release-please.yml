name: Release PR

# Keeps one open Release PR against master carrying the next version and the
# changelog entries generated from conventional-commit PR titles. Merging it
# IS the bump: the merge commit sets `version` in apps/desktop/package.json
# and prepends apps/desktop/CHANGELOG.md, and the Release DMG workflow then
# builds and publishes that version (see AGENTS.md — "Cutting a Kore release").
#
# This workflow deliberately creates no GitHub release and no tag
# (`skip-github-release` in config.stable.json). Tagging and publishing belong
# to release-dmg.yml, whose tauri-action creates the `v<version>` tag and the
# `Kore v<version>` release with the DMG and the updater manifest. Letting
# release-please also create releases produced untagged, asset-less drafts
# that the in-app updater could pick up as "latest" — never re-enable it
# without moving publishing here too.
#
# release.yml (signed + notarized) and testflight.yml stay available on
# workflow_dispatch; neither is part of the day-to-day bump.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  # Dispatch CI on the Release PR branch (see the last step).
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: stable
        with:
          target-branch: master
          config-file: .github/release-please/config.stable.json
          manifest-file: .github/release-please/manifest.stable.json

      # The Release PR is opened with GITHUB_TOKEN, and events from that token
      # start no workflows: its pull_request CI run appears with zero jobs and
      # fails, so the `all-green` check that protects master never reports and
      # the Release PR could not merge. workflow_dispatch is the documented
      # exception, so run CI on the Release PR branch explicitly; its checks
      # land on the PR's head commit.
      # Step env is evaluated before `if`, so the PR JSON is parsed in the
      # script: when no Release PR changed, `pr` is empty and the step skips.
      - name: Run CI on the Release PR
        if: steps.stable.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.stable.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName' <<<"$PR_JSON")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
