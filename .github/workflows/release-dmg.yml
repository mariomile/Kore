# Kore's release channel: a macOS DMG plus signed updater artifacts,
# published to a GitHub release on every version tag.
#
# Two signing modes, picked by which secrets exist:
#
# - Developer ID (APPLE_CERTIFICATE set): the app is signed with Mario's
#   Developer ID Application certificate and notarized with the App Store
#   Connect API key that TestFlight uses too. macOS then ties privacy
#   permissions (calendar, contacts, microphone, notifications) to
#   "app.kore.desktop + team ZQG9377GFQ", so they survive every update, and a
#   fresh download opens without any Gatekeeper workaround. iCloud is left
#   out of this build (no Developer ID provisioning profile for
#   app.kore.desktop yet), so it signs with the iCloud-free entitlements.
# - Unsigned (no APPLE_CERTIFICATE): an ad-hoc signed DMG, as before. A fresh
#   download needs one `xattr -cr /Applications/Kore.app`, and macOS forgets
#   granted permissions on every update.
#
# release.yml (the release-please-driven notarized pipeline) stays separate.
#
# Repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (may be empty)
#   APPLE_CERTIFICATE                   base64 of the Developer ID .p12 (optional)
#   APPLE_CERTIFICATE_PASSWORD          the .p12 export password
#   APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_CONTENT
#                                       App Store Connect API key, for notarizing
#
# The in-app updater polls
#   https://github.com/mariomile/Kore/releases/latest/download/latest.json
# which tauri-action uploads alongside the DMG.

name: Release DMG

on:
  push:
    tags: ['v*']
    # Pointer branch: pushing (or fast-forwarding) release/dmg releases the
    # version in apps/desktop/package.json — the tag-free trigger path.
    branches: ['release/dmg']
  # Manual fallback: builds the version in apps/desktop/package.json and
  # creates (or reuses) its v<version> tag and release.
  workflow_dispatch: {}

concurrency:
  group: release-dmg
  cancel-in-progress: false

permissions:
  contents: write
  # The final step clears the `autorelease: pending` label off the Release PR
  # this build just published.
  pull-requests: write

jobs:
  build:
    name: Build and publish (macOS, Apple Silicon)
    runs-on: macos-latest
    # Same ceiling as release.yml and testflight.yml: fat LTO makes the release
    # link slow, and a hung build should fail instead of holding a runner.
    timeout-minutes: 120
    env:
      # `secrets` is not allowed inside step `if:` expressions — surface the
      # presence of the updater key as an env flag instead.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned: cargo 1.100's build-dir layout breaks tauri-build 2.6.3
          # (sidecar copy hits IsADirectory). Unpin with the tauri 2.12 upgrade.
          toolchain: 1.99.1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the whole workspace once up front (turbo), so the config's
      # beforeBuildCommand (`pnpm sidecar && pnpm build` in apps/desktop)
      # finds its workspace dependencies ready.
      - name: Build workspace
        run: pnpm build

      # GitHub's secret text box preserves whatever whitespace was pasted in
      # (a trailing newline from copying a code block is the common case),
      # and rsign's base64 decoder rejects that outright. Re-export both
      # values through GITHUB_ENV with every newline stripped so a stray
      # trailing line break in the secret can never break the build again.
      - name: Sanitize updater signing key secrets
        if: ${{ env.HAS_UPDATER_KEY == 'true' }}
        run: |
          clean_key=$(printf '%s' "$KEY" | tr -d '\n\r')
          clean_password=$(printf '%s' "$PASSWORD" | tr -d '\n\r')
          echo "::add-mask::$clean_key"
          echo "::add-mask::$clean_password"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$clean_key"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$clean_password"
          } >> "$GITHUB_ENV"
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Developer ID signing + notarization. tauri-action hands these to the
      # Tauri bundler, which imports the .p12 into a temporary keychain, signs
      # the app and its sidecars with the hardened runtime, notarizes through
      # notarytool with the API key and staples the ticket. The checks fail
      # the run up front when the certificate is set but notarizing could not
      # happen, instead of silently shipping a signed-but-unnotarized build.
      - name: Choose the signing mode
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          if [ "$HAS_DEVELOPER_ID" != 'true' ]; then
            {
              echo 'SIGNING_CONFIG={}'
              echo 'RELEASE_INSTALL_NOTE<<KORE_NOTE_EOF'
              echo 'Unsigned build for Apple Silicon Macs.'
              echo ''
              echo '**First install:** download the `.dmg` and drag Kore.app into Applications.'
              echo 'The build is unsigned, so macOS quarantines the download and may claim the'
              echo 'app "is damaged" — it is not. Clear the flag once from Terminal, then open normally:'
              echo ''
              echo '```'
              echo 'xattr -cr /Applications/Kore.app'
              echo '```'
              echo 'KORE_NOTE_EOF'
            } >> "$GITHUB_ENV"
            exit 0
          fi
          missing=()
          for name in CERTIFICATE_PASSWORD API_KEY API_ISSUER API_KEY_CONTENT; do
            [ -n "${!name}" ] || missing+=("APPLE_${name}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::APPLE_CERTIFICATE is set but these secrets are missing: ${missing[*]}"
            exit 1
          fi
          key_path="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s\n' "$API_KEY_CONTENT" > "$key_path"
          clean_certificate=$(printf '%s' "$CERTIFICATE" | tr -d '\n\r ')
          clean_key=$(printf '%s' "$API_KEY" | tr -d '\n\r ')
          clean_issuer=$(printf '%s' "$API_ISSUER" | tr -d '\n\r ')
          echo "::add-mask::$clean_certificate"
          echo "::add-mask::$CERTIFICATE_PASSWORD"
          {
            echo "APPLE_CERTIFICATE=$clean_certificate"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_API_KEY=$clean_key"
            echo "APPLE_API_ISSUER=$clean_issuer"
            echo "APPLE_API_KEY_PATH=$key_path"
            # No iCloud in this build: sign with the iCloud-free entitlements
            # and drop upstream's provisioning profile, which is bound to
            # upstream's certificate and would make the signed app refuse to
            # launch.
            echo 'SIGNING_CONFIG={"bundle":{"macOS":{"entitlements":"Entitlements.dev.plist","files":{"embedded.provisionprofile":null}}}}'
            echo 'RELEASE_INSTALL_NOTE<<KORE_NOTE_EOF'
            echo 'Signed and notarized build for Apple Silicon Macs.'
            echo ''
            echo '**First install:** download the `.dmg`, drag Kore.app into Applications and open it.'
            echo 'KORE_NOTE_EOF'
          } >> "$GITHUB_ENV"

      # Two mutually exclusive publish steps: with the updater keypair in the
      # repo secrets the release carries signed updater artifacts and
      # latest.json (auto-update works); without it the release degrades to a
      # plain DMG instead of failing — add the secrets and re-run to upgrade.
      - name: Build and publish (with auto-update)
        if: ${{ env.HAS_UPDATER_KEY == 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config '${{ env.SIGNING_CONFIG }}'
          tagName: v__VERSION__
          releaseName: 'Kore v__VERSION__'
          releaseBody: |
            ${{ env.RELEASE_INSTALL_NOTE }}

            **Updates:** the app checks this repository's latest release and
            updates itself; nothing to download manually after this.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Build and publish (DMG only — updater secrets not set)
        if: ${{ env.HAS_UPDATER_KEY != 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config '{"bundle":{"createUpdaterArtifacts":false}}' --config '${{ env.SIGNING_CONFIG }}'
          tagName: v__VERSION__
          releaseName: 'Kore v__VERSION__'
          releaseBody: |
            ${{ env.RELEASE_INSTALL_NOTE }}

            _This release was built without the updater keypair, so it will
            not auto-update. Add the `TAURI_SIGNING_PRIVATE_KEY` secrets and
            publish the next release to enable auto-updates._
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      # release-please decides whether it may build the next Release PR by
      # looking for merged release PRs still labelled `autorelease: pending`.
      # It clears that label itself when it creates the GitHub release — but
      # this repo sets `skip-github-release`, because tagging and publishing
      # belong here, so nothing ever cleared it and the next run aborted with
      # "There are untagged, merged release PRs outstanding". Publishing is
      # the moment those PRs genuinely became released, so close the loop.
      #
      # That label is also the interlock that stops release-please computing a
      # version before the tag exists. The Release PR workflow fires on the
      # push that carries the bump, minutes before this build publishes
      # `v<version>`; a run that finds neither the tag nor a pending PR falls
      # back to the whole history and proposes a *lower* version (that is what
      # #89 was). Leaving the label until publish keeps that window shut.
      - name: Mark the published Release PR as released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create 'autorelease: tagged' --force \
            --color ededed \
            --description 'Release PR whose version has been published'
          version=$(node -p "require('./apps/desktop/package.json').version")
          numbers=$(gh pr list --state merged --label 'autorelease: pending' \
            --json number,title \
            --jq ".[] | select(.title == \"chore: release $version\") | .number")
          if [ -z "$numbers" ]; then
            echo "No merged Release PR for $version is waiting to be marked released."
            exit 0
          fi
          for number in $numbers; do
            echo "Marking #$number as released"
            gh pr edit "$number" \
              --remove-label 'autorelease: pending' \
              --add-label 'autorelease: tagged'
          done
