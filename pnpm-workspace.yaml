packages:
  - apps/*
  - packages/*
  - design-system

# Nothing depends on esbuild directly (it floats in as vite's peer, range
# ^0.27 || ^0.28), so the lockfile had frozen a 0.27 resolution that
# GHSA-g7r4-m6w7-qqqr flags (dev-server file read on Windows). Pin the
# patched line; drop the override once a direct dependent requires it.
overrides:
  esbuild: ^0.28.2

allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  simple-git-hooks: false
  spawn-sync: true

dedupePeers: true

strictPeerDependencies: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@meowdown/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@ocavue/*'
  - '@prosemirror-adapter/*'
  - prosemirror-flat-list
  - prosemirror-view
  # Dev-only: the icon generator's source data. 1.2.9 is the first release
  # carrying the bare `close`/`add`/`bot` linear glyphs the set needs.
  - '@iconify-json/solar@1.2.9'
