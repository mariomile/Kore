# Lore's lightweight release channel: an UNSIGNED macOS DMG plus signed
# updater artifacts, published to a GitHub release on every version tag.
#
# This is deliberately separate from release.yml (the signed + notarized
# pipeline, which needs Apple Developer certificates): it needs only the
# Tauri updater keypair, so installed apps can verify and auto-apply
# updates while the app itself stays unsigned. First launch of a freshly
# downloaded DMG needs right-click → Open (Gatekeeper); updates installed
# by the app afterwards do not.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (may be empty)
#
# The in-app updater polls
#   https://github.com/mariomile/My-reflect/releases/latest/download/latest.json
# which tauri-action uploads alongside the DMG.

name: Release DMG

on:
  push:
    tags: ['v*']
    # Pointer branch: pushing (or fast-forwarding) release/dmg releases the
    # version in apps/desktop/package.json — the tag-free trigger path.
    branches: ['release/dmg']
  # Manual fallback: builds the version in apps/desktop/package.json and
  # creates (or reuses) its v<version> tag and release.
  workflow_dispatch: {}

concurrency:
  group: release-dmg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and publish (macOS, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the whole workspace once up front (turbo), so the config's
      # beforeBuildCommand (`pnpm sidecar && pnpm build` in apps/desktop)
      # finds its workspace dependencies ready.
      - name: Build workspace
        run: pnpm build

      # Two mutually exclusive publish steps: with the updater keypair in the
      # repo secrets the release carries signed updater artifacts and
      # latest.json (auto-update works); without it the release degrades to a
      # plain DMG instead of failing — add the secrets and re-run to upgrade.
      - name: Build and publish (with auto-update)
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: 'Lore v__VERSION__'
          releaseBody: |
            Unsigned build for Apple Silicon Macs.

            **First install:** download the `.dmg`, drag Lore.app into
            Applications, then **right-click → Open** the first time
            (Gatekeeper prompt for unsigned apps — once only).

            **Updates:** the app checks this repository's latest release and
            updates itself; nothing to download manually after this.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Build and publish (DMG only — updater secrets not set)
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config '{"bundle":{"createUpdaterArtifacts":false}}'
          tagName: v__VERSION__
          releaseName: 'Lore v__VERSION__'
          releaseBody: |
            Unsigned build for Apple Silicon Macs.

            **First install:** download the `.dmg`, drag Lore.app into
            Applications, then **right-click → Open** the first time
            (Gatekeeper prompt for unsigned apps — once only).

            _This release was built without the updater keypair, so it will
            not auto-update. Add the `TAURI_SIGNING_PRIVATE_KEY` secrets and
            publish the next release to enable auto-updates._
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
