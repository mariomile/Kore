packages:
  - apps/*
  - packages/*
  - design-system

allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  simple-git-hooks: false
  spawn-sync: true

dedupePeers: true

strictPeerDependencies: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@meowdown/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@ocavue/*'
  - '@prosemirror-adapter/*'
  - prosemirror-flat-list
  - prosemirror-view
  # Dev-only: the icon generator's source data. 1.2.9 is the first release
  # carrying the bare `close`/`add`/`bot` linear glyphs the set needs.
  - '@iconify-json/solar@1.2.9'
