# Workspace for all Rust crates: the Tauri desktop shell, the `reflect` CLI,
# the shared index-schema crate, and first-party mobile plugins. One lockfile
# pins one SQLite everywhere — the desktop writer and the CLI reader can
# never skew.
[workspace]
resolver = "2"
members = [
  "apps/cli",
  "apps/desktop/src-tauri",
  "apps/native-host",
  "crates/graph-paths",
  "crates/index-schema",
  "crates/note-policy",
  "plugins/tauri-plugin-keyboard",
  "plugins/tauri-plugin-recording",
]

[workspace.dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
rusqlite_migration = "2.6.0"
sqlite-vec = "0.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
reflect-graph-paths = { path = "crates/graph-paths" }
reflect-note-policy = { path = "crates/note-policy" }

# Shipped builds trade compile time for a smaller, faster binary: one codegen
# unit plus fat LTO lets rustc inline across crates (rusqlite, tauri, serde).
# `panic` stays `unwind` on purpose: a panic inside one Tauri command fails that
# command instead of aborting the whole app. Do not add `strip = "symbols"`: the
# iOS build turns on line tables (CARGO_PROFILE_RELEASE_DEBUG in
# apps/desktop/scripts/release-ios.mjs) for Xcode's dSYM, and stripping would
# remove them. Without that variable Cargo already strips debug info.
[profile.release]
codegen-units = 1
lto = "fat"
