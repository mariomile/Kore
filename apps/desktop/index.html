<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) report real values on
         iOS (zero otherwise); maximum-scale blocks the input auto-zoom that
         WKWebView applies to focused fields. No effect on desktop. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Kore</title>
    <script src="/theme-init.js"></script>
    <!-- The note editor's typeface. Without the preload it is fetched only
         when the first editor lays out, so the daily title paints once in a
         fallback face and then swaps (font-display: swap). Same URL the
         design-system @font-face resolves to, so the two share one fetch. -->
    <link
      rel="preload"
      href="../../design-system/assets/fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Boot splash (src/lib/boot-splash.ts). Inline on purpose: it has to
         paint in the webview's first frame, before the stylesheet or any
         script, so the hand-off from the native launch screen (or the hidden
         macOS window) never shows a blank frame. The CSP allows inline
         styles, not inline scripts. Geometry matches AppBootScreen and
         gen/apple LaunchScreen.storyboard: a 96px mark centred on the full
         viewport over --surface-app, inverted on light themes. -->
    <style>
      #kore-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface-app, #f7f7f8);
        transition: opacity 200ms cubic-bezier(0.2, 0, 0, 1);
      }
      html.dark #kore-boot {
        background: var(--surface-app, #101013);
      }
      html[data-window-role='quick-capture'] #kore-boot {
        display: none;
      }
      #kore-boot.kore-boot-leaving {
        opacity: 0;
        pointer-events: none;
      }
      #kore-boot img {
        display: block;
        height: 96px;
        width: auto;
        filter: invert(1);
        animation: kore-boot-splash-breathe 2.2s ease-in-out infinite;
      }
      html.dark #kore-boot img {
        filter: none;
      }
      @keyframes kore-boot-splash-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #kore-boot,
        #kore-boot img {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="kore-boot" role="status" aria-label="Opening your vault">
      <img src="/src/components/kore-mark.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
