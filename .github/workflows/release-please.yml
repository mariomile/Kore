name: Release PR

# Keeps one open Release PR against master carrying the next version and the
# changelog entries generated from conventional-commit PR titles. Merging it
# IS the bump: the merge commit sets `version` in apps/desktop/package.json
# and prepends apps/desktop/CHANGELOG.md, and the Release DMG workflow then
# builds and publishes that version (see AGENTS.md — "Cutting a Kore release").
#
# This workflow deliberately creates no GitHub release and no tag
# (`skip-github-release` in config.stable.json). Tagging and publishing belong
# to release-dmg.yml, whose tauri-action creates the `v<version>` tag and the
# `Kore v<version>` release with the DMG and the updater manifest. Letting
# release-please also create releases produced untagged, asset-less drafts
# that the in-app updater could pick up as "latest" — never re-enable it
# without moving publishing here too.
#
# release.yml (signed + notarized) and testflight.yml stay available on
# workflow_dispatch; neither is part of the day-to-day bump.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: stable
        with:
          target-branch: master
          config-file: .github/release-please/config.stable.json
          manifest-file: .github/release-please/manifest.stable.json
